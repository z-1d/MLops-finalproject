name: DevOps MLOps Pipeline
on:
  pull_request:
    branches: [main, staging, dev]
  push:
    branches: [main, staging]
jobs:
  Continuous-Integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: ruff check .
      - run: python -m pytest tests/
      - run: docker build -t ml-app-test .
  Continuous-Delivery-Staging:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    steps:
      - uses: actions/checkout@v3
      - run: echo "${{ secrets.STAGING_ENV }}" > staging.env
      - run: docker build -t ml-app-staging .
  Continuous-Deployment-Prod:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
      - run: echo "${{ secrets.PROD_ENV }}" > production.env
      - run: docker build -t ml-app-prod .
